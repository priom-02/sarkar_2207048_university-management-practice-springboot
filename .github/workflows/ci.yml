name: Java CI with Maven

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Build & Run All Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: university_db
          MYSQL_USER: university_user
          MYSQL_PASSWORD: university123
        ports:
          - 3307:3306
        options: --health-cmd="mysqladmin ping -h localhost -uroot -proot123" --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Run Unit and Integration Tests
        env:
          ADMIN_NAME: "System Admin"
          ADMIN_EMAIL: "admin@university.com"
          ADMIN_PASSWORD: "AdminPassword123"
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3307/university_db
          SPRING_DATASOURCE_USERNAME: university_user
          SPRING_DATASOURCE_PASSWORD: university123
        run: ./mvnw test

      - name: Build Executable JAR
        env:
          ADMIN_NAME: "System Admin"
          ADMIN_EMAIL: "admin@university.com"
          ADMIN_PASSWORD: "AdminPassword123"
        run: ./mvnw package -DskipTests

